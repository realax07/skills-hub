schema_version: "1.1"
name: no-canon-element
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Переключателя в каноне нет: агент собирает его из токенов и ближайших канонических деталей, не вводит новый зелёный цвет молча — спрашивает или явно сообщает, что зелёного в палитре нет и что выбрано вместо него. Запускает check.mjs и объясняет оставшийся «новый вариант».
