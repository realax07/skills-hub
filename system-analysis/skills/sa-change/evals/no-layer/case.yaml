expected_outcome: |
  В репозитории нет слоя sa-scan (system-context/, openspec/specs/). change.py layer сообщает об этом; агент не выдумывает влияние и
  не пишет пакет «по памяти»: говорит пользователю, что сначала нужен sa-scan (спеки «как есть» и карта системы), и почему;
  может кратко описать, что затронет доработка по коду, явно пометив, что влияние не посчитано. Код не меняется.
