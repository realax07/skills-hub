schema_version: "1.1"
name: order-comment-field
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Поле сущности: агент запускает analyze с --entity Order (места создания, миграция Prisma) и возможностями оформления и просмотра заказа.
  Дельты: ADDED или MODIFIED требований оформления (комментарий до 500 символов, что при превышении — 422 или иное, решено в design)
  и просмотра (менеджер видит комментарий; покупатель — решение или вопрос). design.md: поле (имя, тип, nullable), миграция,
  контракт POST /api/orders «было → стало», совместимость. tasks.md: схема Prisma и миграция, создание заказа (src/routes/orders.ts),
  выдача в карточке, тесты по сценариям, trace.md — у каждой задачи файл и критерий. impact.md — решения у всех пунктов. check без ошибок.
