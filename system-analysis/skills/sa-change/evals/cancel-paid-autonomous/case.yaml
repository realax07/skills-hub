schema_version: "1.1"
name: cancel-paid-autonomous
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Агент работает автономно. change.py layer → find → new → analyze с --cap order-cancellation (и при необходимости order-payment).
  В openspec/changes/<id>/: impact.md с решением у каждого пункта (место создания заказа, миграция, Q-004 и Q-003),
  proposal.md с разделами «Влияние» и «Открытые вопросы», где Q-004 («может ли покупатель сам отменить оплаченный») назван как блокирующий
  с принятым допущением; дельта specs/order-cancellation/spec.md — MODIFIED «Отмена заказа покупателем» со всеми сценариями исходной версии
  (сценарий «Оплаченный заказ» переписан, имя сохранено), требование про возврат через Stripe; design.md с решениями (частичный возврат,
  ошибка Stripe), tasks.md с задачами по месту в коде и критерием «готово», последней — trace.md. change.py check без ошибок.
  Код проекта не изменён. В отчёте — блокирующий вопрос Q-004 вынесен в чат как требующий ответа до разработки.
