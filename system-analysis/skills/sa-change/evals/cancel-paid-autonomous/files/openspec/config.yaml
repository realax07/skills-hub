# OpenSpec: настройки проекта. Создано sa-scan; правь свободно, но держи context коротким:
# факты о коде и подробная документация — в system-context/, здесь — фон и указатели.
schema: spec-driven

context: |
  Сервис заказов интернет-магазина: покупатель оформляет и оплачивает заказ картой (Stripe),
  менеджер отгружает оплаченные через склад-партнёр.
  Язык спецификаций — русский; ключевые слова SHALL/MUST и шаги WHEN/THEN — по-английски.
  Карта системы (входы, интеграции, предметная область, глоссарий, связь требований с кодом,
  открытые вопросы) — system-context/GUIDE.md. Читай нужный файл оттуда, а не всё подряд.
  По каждой возможности есть короткая карточка system-context/caps/<id>.md — начинай с неё, большие файлы
  (contracts.md, data.md, QUESTIONS.md) не читай целиком, ищи в них grep по имени входа, события или сущности.

# sa-scan:rules-start
rules:
  proposal:
    - "Найди затронутые возможности в system-context/GUIDE.md (таблица «Возможности») и открой карточку каждой: system-context/caps/<id>.md."
    - "Добавь раздел «Влияние»: каждый вызывающий и подписчик из карточек, которого задевает изменение, и что у него поменяется или сломается; ломающее изменение контракта — отдельной строкой."
    - "Вопросы с пометкой [блокирует] из карточек затронутых возможностей — раздел «Открытые вопросы»; на их допущения молча не опирайся, спроси человека."
    - "Новые термины предметной области — сначала в system-context/glossary.md."
  specs:
    - "Требование — наблюдаемое поведение системы, без имён файлов, классов и библиотек: ссылки на код ведутся в system-context/trace.md."
    - "Требование называет вход так, как его видит вызывающий: метод и путь HTTP, RPC, событие или тема очереди."
    - "MODIFIED копирует требование целиком со всеми сценариями; пометку (допущение: Q-…) оставь, пока вопрос в system-context/QUESTIONS.md не закрыт."
    - "Одно поведение — одно требование; каждое с SHALL или MUST и хотя бы одним сценарием WHEN/THEN; термины — как в system-context/glossary.md."
  design:
    - "Новое или изменённое поле сущности: пройди её раздел в system-context/data.md («Создаётся», «Копии полей», «Засев», «Уходит в модель ИИ») и назови каждое место, где поле нужно добавить."
    - "Меняешь вход или событие: сверь с его разделом в system-context/contracts.md (поля, ответы, копии события в других сервисах) и с «Опирается на» у вызывающих."
    - "Учти ограничения из system-context/data.md (конкурентность, транзакции, валидация) и «При отказе» в system-context/integrations.md для затронутых внешних систем."
  tasks:
    - "Для каждого вызывающего и подписчика из раздела «Влияние» — задача: обновить его или проверить, что он не сломан."
    - "Для каждого места из «Копии полей» и «Создаётся», где меняется поле, — отдельная задача: такие места теряют поле молча."
    - "Интерфейсная правка и в проекте есть design-context/ — задача проверить страницу скриптом check.mjs скилла wd-fit."
    - "Последние задачи — тесты затронутых возможностей и обновление слоя: строки system-context/trace.md и пересборка (см. указания к apply)."
operations:
  apply:
    guidance:
      - "Перед задачами открой карточки затронутых возможностей (system-context/caps/<id>.md): там вызывающие, копии полей и блокирующие вопросы."
      - "Задача требует решения, которого нет в спеке и карточке (новый цвет, новый статус, поведение по блокирующему вопросу), — спроси, не решай молча."
      - "После задач обнови слой: строки system-context/trace.md; если установлен скилл sa-scan — python3 <sa-scan>/scripts/contracts.py scan . и python3 <sa-scan>/scripts/plan.py guide .; если нет — пункт «обновить system-context» в отчёте."
  archive:
    guidance:
      - "После архивации основные спеки изменились: если установлен скилл sa-scan — python3 <sa-scan>/scripts/plan.py guide . (карточки) и python3 <sa-scan>/scripts/check.py .; иначе — пункт «обновить system-context» в отчёте."
# sa-scan:rules-end
