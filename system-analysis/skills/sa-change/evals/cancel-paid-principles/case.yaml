schema_version: "1.1"
name: cancel-paid-principles
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Отмена оплаченного заказа покупателем, как в cancel-paid-landscape, но у проекта ещё и принципы ar-rules (system-context/principles.json).
  analyze даёт пункты P: P-03 (денежные операции с ключом идемпотентности — возврат через Stripe сейчас без ключа), P-01 (общая база),
  P-02 (таймауты), P-05; по P-03 — задача передать ключ идемпотентности в stripe.refunds.create (например от id заказа), а не «соблюдено»
  без изменения кода; повтор отмены в «Цепочке» опирается на этот ключ. Изменение не расширяет нарушения P-01 и P-02. У каждого пункта P
  решение «задача», «соблюдено: как» или «исключение: почему». change.py check без ошибок.
