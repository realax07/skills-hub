schema_version: "1.1"
name: cancel-paid-landscape
context:
  scaffold_script: place-files.sh
expected_outcome: |
  То же изменение, что в cancel-paid-autonomous (покупатель отменяет оплаченный заказ до отгрузки с возвратом через Stripe), но у проекта
  есть срез ландшафта ar-scan (system-context/landscape.json). change.py layer показывает ландшафт, analyze даёт пункты L: портал поддержки
  и мобильное приложение вызывают /api/orders, общая база с warehouse-sync. Решения по пунктам L — по их коду из ландшафта: мобильное
  приложение показывает кнопку отмены только для NEW (задача на клиент или согласование с командой мобильной разработки, в proposal
  «Влияние»); warehouse-sync выбирает заказы PAID для сборки — гонка «отменён, но собран» в «Цепочке» и задача или вопрос владельцу;
  портал поддержки — не затрагивается с причиной или задача. Код других систем не правится (их задачи — согласование, а не правка
  чужого репозитория). change.py check без ошибок.
