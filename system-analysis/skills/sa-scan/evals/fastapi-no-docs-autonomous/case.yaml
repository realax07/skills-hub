schema_version: "1.1"
name: fastapi-no-docs-autonomous
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Агент работает автономно, ничего не спрашивая в процессе. Опись находит маршруты FastAPI с префиксами /documents и /admin, celery-задачи,
  расписание очистки и CLI reconvert; /healthz исключён как служебное. Спеки — по возможностям (загрузка и конвертация, получение результата,
  повтор администратором или близко) с ограничениями из кода: форматы .docx/.odt/.rtf, 20 МБ, 3 повтора, ссылка на час. Вопросы в файле —
  о внешнем мире: контракт сервиса конвертации (CONVERTER_URL), шлюз, который проставляет X-User-Id и роль, пустая задача очистки (TODO),
  кто получает алерты в Telegram. integrations.md описывает конвертер, S3 и Telegram; contracts.md и data.md собраны скриптом и дописаны (ответы 202/415/413, модель Document). check.py без ошибок, в отчёте — число вопросов и путь к файлу.
