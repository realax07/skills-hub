# OpenSpec: настройки проекта. Создано sa-scan; правь свободно, но держи context коротким:
# факты о коде и подробная документация — в system-context/, здесь — фон и указатели.
schema: spec-driven

context: |
  Сервис заказов интернет-магазина: покупатель оформляет и оплачивает заказ картой (Stripe),
  менеджер отгружает оплаченные через склад-партнёр.
  Язык спецификаций — русский; ключевые слова SHALL/MUST и шаги WHEN/THEN — по-английски.
  Карта системы (входы, интеграции, предметная область, глоссарий, связь требований с кодом,
  открытые вопросы) — system-context/GUIDE.md. Читай нужный файл оттуда, а не всё подряд.

rules:
  proposal:
    - "Перед предложением открой system-context/QUESTIONS.md — нет ли открытых вопросов по затронутым возможностям; блокирующий — упомяни в proposal."
    - "Новые термины предметной области — сначала в system-context/glossary.md."
  specs:
    - "Требование — наблюдаемое поведение системы, без имён файлов, классов и библиотек: ссылки на код ведутся в system-context/trace.md."
    - "Одно поведение — одно требование; каждое с SHALL или MUST и хотя бы одним сценарием WHEN/THEN."
    - "Термины — как в system-context/glossary.md."
  tasks:
    - "Последней задачей — обновить system-context/trace.md (требование → код) и integrations.md, если менялся внешний вызов."
