schema_version: "1.1"
name: shop-principles
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Агент работает автономно: rules.py scan (кандидаты из ADR-0001, страницы стандартов и architecture.md), принципы через rules.py add —
  чужая база, таймаут не больше 5 с, идемпотентность денежных операций, идемпотентность обработчиков, DLQ, секреты, ПДн в логах;
  «стараемся писать тесты» и описания поведения — «не принцип». У каждого принципа источник и проверка: скриптом (no-shared-db, timeout,
  grep) или review с вопросом. rules.py verify: notifications и общая база заказов (исключение только с источником — Q-001 из ландшафта,
  или нарушение), orders → payments без таймаута, Stripe и SendGrid по 10 с, нет ключа идемпотентности в payments. У каждого нарушения
  «Проверка» по месту и решение. rules.py check без ошибок, link не запускался, в repos/ ничего не записано.
