# Реестр код-агентов: куда класть скиллы.
# Формат (через пробелы/табы):
#   id   user_dir   project_dir   layout
#
#   user_dir    — глобальная папка скиллов (~ раскрывается в $HOME / %USERPROFILE%)
#   project_dir — папка скиллов внутри проекта (относительно --project), "-" если не поддерживается
#   layout      — flat:     <dir>/<skill>/SKILL.md
#                 category: <dir>/<topic>/<skill>/SKILL.md   (Hermes группирует скиллы по категориям)
#
# Агент считается установленным, если существует родитель user_dir (например ~/.claude).
# Чтобы поправить путь локально, не трогая репо, создай agents.local.conf
# с теми же колонками — строки с тем же id перекрывают эти.
#
# id        user_dir                      project_dir        layout   # статус пути
claude      ~/.claude/skills              .claude/skills     flat     # официальная дока
codex       ~/.codex/skills               .agents/skills     flat     # официальная дока
opencode    ~/.config/opencode/skills     .opencode/skills   flat     # официальная дока
qwen        ~/.qwen/skills                .qwen/skills       flat     # официальная дока
hermes      ~/.hermes/skills              -                  category # официальная дока
zcode       ~/.zcode/skills               .zcode/skills      flat     # НЕ проверено по офиц. доке
agents      ~/.agents/skills              .agents/skills     flat     # общий стандарт agentskills (читают opencode, codex и др.)
