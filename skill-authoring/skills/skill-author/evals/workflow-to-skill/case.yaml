schema_version: "1.1"
name: workflow-to-skill
expected_outcome: |
  Агент создаёт ./skills/<имя>/ с полной структурой: SKILL.md с description, где есть и что делает, и когда применять;
  references/rules.md с правилами пользователя и причинами; examples/ с примером плохо/хорошо; scripts/ со скриптом разбора
  git log по типам коммитов (--help, --json); шаблон changelog в assets/; минимум два тест-кейса в evals/. Перед ответом
  агент прогоняет валидацию и сообщает путь, дерево файлов и как установить скилл.
