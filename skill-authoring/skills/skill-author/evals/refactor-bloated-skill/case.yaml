schema_version: "1.1"
name: refactor-bloated-skill
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Агент переписывает description (что делает + когда, с формулировками пользователя), переносит блоки кода из SKILL.md
  в запускаемый скрипт(ы) в scripts/ с CLI, правила — в references/rules.md с причинами вместо капса, добавляет examples/ и evals/.
  Логика (кодировки, форматы чисел и дат, пропуск пустых строк, предупреждение о >10% пропусков) сохранена. SKILL.md становится короче
  и содержит таблицу ресурсов с указанием, когда что открывать. openpyxl объявлен как зависимость.
