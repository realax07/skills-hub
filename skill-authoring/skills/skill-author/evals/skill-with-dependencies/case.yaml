schema_version: "1.1"
name: skill-with-dependencies
expected_outcome: |
  Агент создаёт скилл со скриптом обработки картинок и явной установкой зависимостей: compatibility во frontmatter,
  scripts/setup.py (или аналог) с режимом --check, пиннованной версией Pillow и установкой вне папки скилла (кэш пользователя,
  отдельно для Windows). Первый шаг процесса в SKILL.md — проверка зависимостей. Скрипты кроссплатформенные (pathlib, без bash).
  Агент сообщает, куда положил скилл и почему.
