schema_version: "1.1"
name: testrail-xml-with-openspec
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Агент переносит 8 кейсов из XML TestRail скриптами (fetch.py file, build.py), а не пишет md руками: появляется test-cases/ с папками
  по секциям (оформление, отмена/покупатель, отмена/менеджер, доставка), ROUTING.md, INDEX.md и _index/. Пароли и JWT из шагов скрыты
  как [скрыто: S-NN], значения нигде в слое не встречаются. map.py auto связывает кейсы с возможностями openspec и находит автотесты
  в test/orders.test.ts. lint.py пишет QUALITY.md (дубли, «Работает»), текст кейсов не изменён. Указатель вписан в AGENTS.md
  (его не было — создан). check.py без ошибок. В отчёте — числа, скрытые секреты как вопрос человеку, пробел покрытия order-payment.
