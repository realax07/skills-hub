schema_version: "1.1"
name: static-site-design-context
context:
  scaffold_script: place-files.sh
expected_outcome: |
  В design-context/ лежит слой для агента и эталон. foundations.md — цвета с ролями и CSS-переменными сайта
  (--color-text, --color-primary), типографика, движение. parts/ — варианты кнопок, полей, ссылок с разметкой,
  компоненты из плана (шапка, футер, карточка с отрисованным JS заголовком) и оверлеи (окно входа, открытое кликом,
  меню «Ещё»). compositions/ — схемы главной, about, блога, статьи, продуктовых страниц. В плане stance: normalize
  (пользователь сказал «по канону») и разбор деталей (parts со статусами). reference/ — снимки страниц без скриптов,
  фото статей заменены заглушками. verify пройден, агент докладывает основы, канон и разделы.
