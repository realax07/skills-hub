schema_version: "1.1"
name: pricing-variants
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Агент берёт выжимку контекста (в ней тёмная тема), запускает mock.mjs new для главной, заполняет PLAN.md тремя разными подходами (например карточки / таблица сравнения / переключатель с одной карточкой), верстает три фрагмента из канона и переменных сайта, собирает mock.mjs build (проверка во всех темах, мера различия, страница сравнения), исправляет нарушения, сообщает итог и рекомендацию и ждёт выбора — site/ не меняет.
