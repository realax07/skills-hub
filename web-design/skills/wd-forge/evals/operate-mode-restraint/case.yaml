schema_version: "1.1"
name: operate-mode-restraint
expected_outcome: |
  Агент определяет режим operate (рабочий интерфейс), раздаёт направления с этим режимом: сдержанная плотность, движение still/subtle, без игривых шрифтов; варианты различаются сценарием (архетипом), а не только цветом; проверка без ошибок.
