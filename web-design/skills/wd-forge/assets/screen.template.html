<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!-- Экран — Продукт --></title>
  <!-- Порядок важен: сначала токены направления, потом гигиена, потом свои стили только через var(--…) -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <style>
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-4); }
    /* Кнопки, чипы, ссылки меню, логотип — цель нажатия не меньше 44×44px на мобильном */
    .btn, nav a, .logo { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; }
    .btn { justify-content: center; padding: 0 var(--space-4);
      border-radius: var(--radius-md); background: var(--color-accent); color: var(--color-on-accent);
      text-decoration: none; font-family: var(--font-ui); transition: transform var(--dur) var(--ease); }
    /* Мобильная версия обязательна */
    @media (max-width: 760px) { .wrap { padding: 0 var(--space-3); } }
  </style>
</head>
<body>
  <header><!-- навигация по архетипу из PLAN.md --></header>
  <main class="wrap">
    <!-- секции по каркасу из PLAN.md; фото — <div class="ph" style="--ph-ratio: 4/3" role="img" aria-label="что на фото"></div> -->
  </main>
  <footer><!-- --></footer>
</body>
</html>
